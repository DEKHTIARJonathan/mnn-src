---
name: CI
"on":
  pull_request:
  workflow_dispatch:
  push:
    branches: [master]
    tags: ['v*']
permissions:
  contents: read
env:
  RUSTC_WRAPPER: sccache
  CARGO_INCREMENTAL: '0'
  SCCACHE_DIR: ${{ github.workspace }}/target/sccache
  SCCACHE_CACHE_SIZE: 1G
  MNN_CACHE_CASE: tools
  SCCACHE_DIRECT: 'false'
  SCCACHE_BASEDIRS: ${{ github.workspace }}
  CMAKE_TOOLCHAIN_FILE: ${{ github.workspace }}/.github/sccache.cmake
  MNN_TEST_WORK_DIR: ${{ github.workspace }}/target/ci-consumer
jobs:
  pre-commit:
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt
      # Snapshot compiler objects once per job instead of one network request
      # per compilation. Each object still uses sccache's compiler/input hash.
      - &compiler-cache-key
        name: Normalize compiler cache case
        shell: bash
        run: echo "MNN_CACHE_CASE=${MNN_CACHE_CASE//,/_}" >> "$GITHUB_ENV"
      - &compiler-cache
        uses: actions/cache@v6.1.0
        with:
          path: ${{ env.SCCACHE_DIR }}
          key: >-
            ${{ format('sccache-local-v1-{0}-{1}-{2}-{3}-{4}-{5}',
                runner.os, runner.arch, github.job, env.MNN_CACHE_CASE,
                github.run_id, github.run_attempt) }}
          restore-keys: >-
            ${{ format('sccache-local-v1-{0}-{1}-{2}-{3}-',
                runner.os, runner.arch, github.job, env.MNN_CACHE_CASE) }}
      - &setup-sccache
        uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: v0.19.0
          # Report explicitly before stopping the server and saving its files.
          disable_annotations: true
      - &start-sccache
        name: Start local compiler cache
        shell: bash
        run: |
          mkdir -p "$SCCACHE_DIR"
          sccache --start-server
      - uses: cargo-bins/cargo-binstall@v1.26.1
      - run: cargo binstall --locked --no-confirm cargo-audit@0.22.2
      - uses: j178/prek-action@v3.1.0
        with:
          prek-version: '0.5.5'
      - run: cargo fmt --check
      - run: cargo fmt --manifest-path testcrate/Cargo.toml --check
      - name: Select manifest feature cases
        id: matrix
        shell: python
        run: |
          import json
          import os
          import tomllib
          features = tomllib.load(open("Cargo.toml", "rb"))["features"]
          cases = []
          for host in ["ubuntu-latest", "macos-latest", "windows-latest"]:
              for mode in ["static", "shared"]:
                  assert mode in features
                  cases.append({"os": host, "features": mode})
              extras = [f for f in ["bf16", "low-memory", "transformer-fuse"]
                        if f in features]
              cases.append({"os": host,
                            "features": ",".join(["static", *extras])})
              backends = (["metal", "kleidiai"] if host == "macos-latest"
                          else ["opencl", "vulkan"])
              for backend in backends:
                  if backend in features:
                      cases.append({"os": host,
                                    "features": "static," + backend})
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write("matrix=" + json.dumps({"include": cases}) + "\n")
      - &compiler-cache-stats
        name: Report and flush compiler cache
        if: always() && env.SCCACHE_PATH != ''
        shell: bash
        run: |
          sccache --show-stats --stats-format=json
          {
            echo '```text'
            sccache --stop-server
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
  package:
    needs: pre-commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@1.98.0
      - *compiler-cache-key
      - *compiler-cache
      - *setup-sccache
      - *start-sccache
      - name: Fetch the pinned upstream release tag
        shell: bash
        run: |
          version=$(python3 -c 'import tomllib;
          print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"]
          .split("-")[0])')
          git -C mnn fetch --depth 1 origin \
            "refs/tags/$version:refs/tags/$version"
      - run: make package
      - name: Verify identical repackaging
        run: |
          mkdir -p target/repackage
          tar -xf dist/*.crate -C target/repackage --strip-components=1
          mv target/repackage/Cargo.toml.orig target/repackage/Cargo.toml
          cargo package --manifest-path target/repackage/Cargo.toml \
            --locked --no-verify
          cmp dist/*.crate target/repackage/target/package/*.crate
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: candidate
          path: dist/*.crate
          if-no-files-found: error
      - *compiler-cache-stats
  smoke-tests:
    env:
      MNN_CACHE_CASE: ${{ matrix.features }}
    needs: [pre-commit, package]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.pre-commit.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@1.98.0
      - uses: ilammy/msvc-dev-cmd@v1.13.0
        if: runner.os == 'Windows'
      - *compiler-cache-key
      - *compiler-cache
      - *setup-sccache
      - *start-sccache
      - uses: actions/download-artifact@v8.0.2
        with:
          name: candidate
          path: dist
      - name: Test extracted crate
        env:
          MNN_TEST_FEATURES: ${{ matrix.features }}
          CMAKE_GENERATOR: Ninja
        run: python verify.py
      - *compiler-cache-stats
  cuda-builds:
    env:
      MNN_CACHE_CASE: ${{ matrix.features }}
    needs: package
    runs-on: ubuntu-latest
    container: nvidia/cuda:12.8.1-devel-ubuntu24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        features:
          - static,cuda
          - shared,cuda
          - static,cuda,transformer-fuse,low-memory
          - shared,cuda,transformer-fuse,low-memory
    steps:
      - name: Install build prerequisites
        run: |
          apt-get update
          apt-get install -y build-essential cmake ninja-build python3 curl git
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@1.98.0
      - *compiler-cache-key
      - *compiler-cache
      - *setup-sccache
      - *start-sccache
      - uses: actions/download-artifact@v8.0.2
        with:
          name: candidate
          path: dist
      - name: Compile and link CUDA consumer
        env:
          MNN_TEST_FEATURES: ${{ matrix.features }}
          MNN_BUILD_ONLY: '1'
          CMAKE_GENERATOR: Ninja
          CMAKE_BUILD_PARALLEL_LEVEL: '2'
        run: python3 verify.py
      - *compiler-cache-stats
  publish:
    if: github.ref_type == 'tag'
    needs: [smoke-tests, cuda-builds]
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@1.98.0
      - *compiler-cache-key
      - *compiler-cache
      - *setup-sccache
      - *start-sccache
      - uses: actions/download-artifact@v8.0.2
        with:
          name: candidate
          path: dist
      - name: Reconstruct tested archive
        run: |
          version=$(python3 -c 'import tomllib;
          print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')
          test "$GITHUB_REF_NAME" = "v$version"
          mkdir -p target/publication
          tar -xf dist/*.crate -C target/publication --strip-components=1
          mv target/publication/Cargo.toml.orig target/publication/Cargo.toml
          cargo package --manifest-path target/publication/Cargo.toml \
            --locked --no-verify
          cmp dist/*.crate target/publication/target/package/*.crate
      - uses: rust-lang/crates-io-auth-action@v1.0.6
        id: auth
      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: >-
          cargo publish --manifest-path target/publication/Cargo.toml
          --locked --no-verify
      - *compiler-cache-stats
  verify:
    if: github.ref_type == 'tag'
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.2
        with:
          name: candidate
          path: dist
      - name: Compare registry archive
        run: |
          version=$(python3 -c 'import tomllib;
          print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')
          mkdir -p target
          curl --fail --location --retry 12 --retry-all-errors \
            --retry-delay 10 \
            "https://static.crates.io/crates/mnn-src/mnn-src-$version.crate" \
            --output target/registry.crate
          cmp dist/*.crate target/registry.crate
